<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrollstrip review</title>
  <style>
    :root {
      --bg: #101114;
      --panel: #1a1c22;
      --ink: #e8e6e1;
      --muted: #9a968c;
      --line: #2c2f38;
      --accent: #6ee7a8;
      --warn: #f0b429;
      --hot: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Segoe UI", sans-serif; }
    #app { display: grid; grid-template-columns: 220px 1fr 300px; grid-template-rows: 56px 1fr; height: 100%; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .grow { flex: 1; color: var(--muted); }
    button, select, input { background: #252833; color: var(--ink); border: 1px solid #3a3e4a; border-radius: 6px; padding: 6px 10px; }
    button.primary { background: #1f6f4a; border-color: #2a8a5d; }
    button.danger { background: #6a2424; border-color: #8a3030; }
    button:hover { filter: brightness(1.08); cursor: pointer; }
    #pages { overflow: auto; border-right: 1px solid var(--line); padding: 8px; }
    .thumb { display: flex; gap: 8px; padding: 6px; border-radius: 8px; cursor: pointer; }
    .thumb.active { background: #243028; }
    .thumb img { width: 52px; height: 72px; object-fit: cover; background: #000; border-radius: 4px; }
    .thumb .meta { font-size: 12px; color: var(--muted); }
    #stage-wrap { overflow: auto; background: #0b0c0f; position: relative; }
    #stage { position: relative; margin: 16px auto; display: inline-block; }
    #page-img { display: block; max-width: none; }
    .box { position: absolute; border: 2px solid var(--accent); background: rgba(110,231,168,0.08); cursor: move; }
    .box.reaction { border-color: #7ec8ff; }
    .box.splash { border-color: #ff8a8a; }
    .box.selected { border-width: 3px; box-shadow: 0 0 0 1px #fff inset; }
    .box .handle { position: absolute; width: 10px; height: 10px; background: #fff; right: -5px; bottom: -5px; cursor: nwse-resize; }
    .box .tag { position: absolute; left: 4px; top: 4px; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 3px; }
    #inspector { border-left: 1px solid var(--line); overflow: auto; padding: 12px; background: var(--panel); }
    #inspector h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input[type="number"], select { width: 100%; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 12px; }
    #plist { list-style: none; padding: 0; margin: 8px 0; }
    #plist li { display: flex; justify-content: space-between; padding: 4px 0; cursor: pointer; }
    #plist li.sel { color: var(--accent); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Scrollstrip</h1>
      <div class="grow" id="title"></div>
      <button id="prev">Prev</button>
      <button id="next">Next</button>
      <button id="add">Add box</button>
      <button id="redetect">Re-detect page</button>
      <button id="save">Save</button>
      <button class="primary" id="assemble">Assemble chapter</button>
    </header>
    <aside id="pages"></aside>
    <div id="stage-wrap"><div id="stage"><img id="page-img" alt="" /><div id="boxes"></div></div></div>
    <aside id="inspector">
      <h2>Page</h2>
      <label>Kind</label>
      <select id="kind">
        <option value="normal">normal</option>
        <option value="splash">splash (full art)</option>
        <option value="spread">spread (letterbox)</option>
        <option value="skip">skip</option>
      </select>
      <h2 style="margin-top:18px">Selected panel</h2>
      <div id="nopanel" class="hint">Click a box or add one.</div>
      <div id="pedit" hidden>
        <label>Reading order</label>
        <input id="order" type="number" min="0" />
        <label>Role</label>
        <select id="role">
          <option value="normal">normal — full width</option>
          <option value="reaction">reaction — smaller scale</option>
          <option value="splash">splash — large gutter after</option>
        </select>
        <div class="row">
          <div>
            <label>Scale (1 = full 1080)</label>
            <input id="scale" type="number" min="0.3" max="1" step="0.02" />
          </div>
          <div>
            <label>Gutter after</label>
            <select id="gutter">
              <option value="tight">tight 20–40</option>
              <option value="medium">medium 60–120</option>
              <option value="large">large 200–400</option>
            </select>
          </div>
        </div>
        <label><input id="locked" type="checkbox" /> Lock (keep on re-detect)</label>
        <div style="margin-top:10px; display:flex; gap:8px">
          <button id="front">Send to front of order</button>
          <button class="danger" id="remove">Delete box</button>
        </div>
      </div>
      <h2 style="margin-top:18px">Panels on this page</h2>
      <ul id="plist"></ul>
      <p class="hint">
        Drag boxes. Drag the white corner to resize. First-pass gutters:
        tight = action/banter, medium = normal beat, large = reveal or page turn.
        Assembly never cuts through a panel.
      </p>
      <p class="hint" id="export-status"></p>
    </aside>
  </div>
  <script>
    const state = { project: null, pageIndex: 0, selected: null, drag: null };
    const $ = (id) => document.getElementById(id);

    async function load() {
      state.project = await (await fetch("/api/project")).json();
      $("title").textContent = state.project.name + " — " + state.project.pages.length + " pages";
      renderPages();
      showPage(state.pageIndex);
    }

    function page() { return state.project.pages[state.pageIndex]; }

    function renderPages() {
      $("pages").innerHTML = state.project.pages.map((p, i) => `
        <div class="thumb ${i===state.pageIndex?'active':''}" data-i="${i}">
          <img src="/files/${p.cleaned}" alt="" />
          <div>
            <div>${p.id}</div>
            <div class="meta">${(p.panels||[]).length} panels · ${p.kind}</div>
          </div>
        </div>`).join("");
      $("pages").querySelectorAll(".thumb").forEach(el => {
        el.onclick = () => { persistPageFields(); showPage(+el.dataset.i); };
      });
    }

    function showPage(i) {
      state.pageIndex = Math.max(0, Math.min(state.project.pages.length - 1, i));
      state.selected = null;
      const p = page();
      $("kind").value = p.kind || "normal";
      const img = $("page-img");
      img.onload = () => { drawBoxes(); };
      img.src = "/files/" + p.cleaned + "?t=" + Date.now();
      renderPages();
      renderInspector();
    }

    function scaleFactor() {
      const img = $("page-img");
      const p = page();
      if (!p.width || !img.naturalWidth) return 1;
      return img.clientWidth / p.width;
    }

    function drawBoxes() {
      const wrap = $("boxes");
      wrap.innerHTML = "";
      const s = scaleFactor();
      (page().panels || []).forEach((panel, idx) => {
        const el = document.createElement("div");
        el.className = "box " + (panel.role || "normal") + (state.selected===idx?" selected":"");
        el.style.left = (panel.bbox[0]*s) + "px";
        el.style.top = (panel.bbox[1]*s) + "px";
        el.style.width = (panel.bbox[2]*s) + "px";
        el.style.height = (panel.bbox[3]*s) + "px";
        el.innerHTML = `<span class="tag">${(panel.order??idx)+1}</span><span class="handle"></span>`;
        el.onmousedown = (ev) => startDrag(ev, idx, ev.target.classList.contains("handle"));
        wrap.appendChild(el);
      });
      renderInspector();
    }

    function startDrag(ev, idx, resize) {
      ev.preventDefault();
      state.selected = idx;
      const panel = page().panels[idx];
      state.drag = {
        idx, resize,
        startX: ev.clientX, startY: ev.clientY,
        bbox: panel.bbox.slice(),
      };
      window.addEventListener("mousemove", onDrag);
      window.addEventListener("mouseup", endDrag);
      drawBoxes();
    }

    function onDrag(ev) {
      const d = state.drag; if (!d) return;
      const s = scaleFactor();
      const dx = (ev.clientX - d.startX) / s;
      const dy = (ev.clientY - d.startY) / s;
      const b = d.bbox.slice();
      if (d.resize) {
        b[2] = Math.max(12, b[2] + dx);
        b[3] = Math.max(12, b[3] + dy);
      } else {
        b[0] = Math.round(b[0] + dx);
        b[1] = Math.round(b[1] + dy);
      }
      page().panels[d.idx].bbox = b.map(v => Math.round(v));
      drawBoxes();
    }

    function endDrag() {
      window.removeEventListener("mousemove", onDrag);
      window.removeEventListener("mouseup", endDrag);
      state.drag = null;
    }

    function renderInspector() {
      const list = $("plist");
      const panels = page().panels || [];
      list.innerHTML = panels.map((p, i) =>
        `<li class="${i===state.selected?'sel':''}" data-i="${i}">#${p.order+1} ${p.role} · scale ${p.scale} · ${p.gutter_after}</li>`
      ).join("");
      list.querySelectorAll("li").forEach(li => li.onclick = () => { state.selected = +li.dataset.i; drawBoxes(); });
      if (state.selected == null || !panels[state.selected]) {
        $("nopanel").hidden = false; $("pedit").hidden = true; return;
      }
      $("nopanel").hidden = true; $("pedit").hidden = false;
      const p = panels[state.selected];
      $("order").value = p.order;
      $("role").value = p.role || "normal";
      $("scale").value = p.scale;
      $("gutter").value = p.gutter_after || "medium";
      $("locked").checked = !!p.locked;
    }

    function persistPageFields() {
      page().kind = $("kind").value;
      if (state.selected != null && page().panels[state.selected]) {
        const p = page().panels[state.selected];
        p.order = parseInt($("order").value, 10) || 0;
        p.role = $("role").value;
        p.scale = parseFloat($("scale").value);
        p.gutter_after = $("gutter").value;
        p.locked = $("locked").checked;
        if (p.role === "reaction" && p.scale === 1) p.scale = 0.78;
        if (p.role === "splash") p.gutter_after = p.gutter_after || "large";
      }
    }

    $("kind").onchange = persistPageFields;
    ["order","role","scale","gutter","locked"].forEach(id => {
      $(id).addEventListener("change", () => { persistPageFields(); drawBoxes(); });
    });
    $("prev").onclick = () => { persistPageFields(); showPage(state.pageIndex-1); };
    $("next").onclick = () => { persistPageFields(); showPage(state.pageIndex+1); };
    $("add").onclick = () => {
      const p = page();
      const n = (p.panels||[]).length;
      p.panels.push({
        id: p.id + "-p" + String(n+1).padStart(2,"0"),
        bbox: [40, 40 + n*20, Math.round((p.width||800)*0.4), Math.round((p.height||1200)*0.25)],
        order: n, score: 1, role: "normal", scale: 1, gutter_after: "medium", locked: true
      });
      state.selected = n;
      drawBoxes();
    };
    $("remove").onclick = () => {
      if (state.selected == null) return;
      page().panels.splice(state.selected, 1);
      page().panels.forEach((p,i) => { p.order = i; });
      state.selected = null;
      drawBoxes();
    };
    $("front").onclick = () => {
      if (state.selected == null) return;
      const panels = page().panels;
      const [item] = panels.splice(state.selected, 1);
      panels.unshift(item);
      panels.forEach((p,i) => p.order = i);
      state.selected = 0;
      drawBoxes();
    };
    $("save").onclick = async () => {
      persistPageFields();
      await fetch("/api/project", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(state.project) });
      $("export-status").textContent = "Saved project.json";
    };
    $("redetect").onclick = async () => {
      persistPageFields();
      await fetch("/api/project", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(state.project) });
      const pageData = await (await fetch("/api/redetect", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({page_id: page().id}) })).json();
      state.project.pages[state.pageIndex] = pageData;
      state.selected = null;
      showPage(state.pageIndex);
    };
    $("assemble").onclick = async () => {
      persistPageFields();
      await fetch("/api/project", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(state.project) });
      const out = await (await fetch("/api/assemble", { method: "POST" })).json();
      $("export-status").textContent = "Wrote " + out.slice_count + " slices → " + out.cbz;
    };
    document.addEventListener("keydown", (ev) => {
      if (["INPUT","SELECT","TEXTAREA"].includes(ev.target.tagName)) return;
      if (ev.key === "ArrowLeft") $("prev").click();
      if (ev.key === "ArrowRight") $("next").click();
      if (ev.key === "Delete" || ev.key === "Backspace") $("remove").click();
    });
    load();
  </script>
</body>
</html>
